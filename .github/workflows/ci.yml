name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check pagedrop
        run: bash -n pagedrop

      - name: Syntax check install
        run: bash -n install

      - name: ShellCheck
        # shellcheck is preinstalled on GitHub's Ubuntu runners
        run: |
          shellcheck --version
          shellcheck pagedrop install test/run.sh test/bin/curl test/wget-bin/wget test/fail-bin/* test/darwin-bin/uname

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests (stub curl, no network)
        run: bash test/run.sh
